# Produção — Oracle Cloud Compute (ARM64)
# MySQL e Redis em volumes nomeados (dados persistem entre restarts)
# Não exponha MySQL/Redis na internet; apenas Nginx na porta 8001 (proxy do host)

name: albatecrest-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: albatecrest-backend-app:latest
    container_name: albatecrest-backend
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
      - ./storage:/var/www/html/storage
      # bootstrap/cache NÃO é bind-mounted de propósito: fica só dentro do
      # container (gerado no build via composer post-autoload-dump). Montar
      # do host já causou queda em produção (bootstrap/cache/packages.php
      # gerado localmente com dependências dev referencia uma classe que não
      # existe na imagem --no-dev, ex.: Laravel\Sail\SailServiceProvider).
      - ./public:/var/www/html/public
    networks:
      - albatecrest-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(0);"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: albatecrest-nginx-internal
    restart: unless-stopped
    ports:
      - '8002:80'
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - albatecrest-backend
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: albatecrest-mysql
    restart: unless-stopped
    expose:
      - '3306'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-distribtec_production}
      MYSQL_USER: ${DB_USERNAME:-distribtec_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - albatecrest_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/distribtec.cnf:ro
    networks:
      - albatecrest-backend
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: albatecrest-redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - albatecrest_redis_data:/data
    networks:
      - albatecrest-backend
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  queue-worker:
    image: albatecrest-backend-app:latest
    container_name: albatecrest-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
      - ./storage:/var/www/html/storage
      # bootstrap/cache NÃO é bind-mounted de propósito: fica só dentro do
      # container (gerado no build via composer post-autoload-dump). Montar
      # do host já causou queda em produção (bootstrap/cache/packages.php
      # gerado localmente com dependências dev referencia uma classe que não
      # existe na imagem --no-dev, ex.: Laravel\Sail\SailServiceProvider).
    networks:
      - albatecrest-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    command: >
      php artisan queue:work redis
      --queue=whatsapp,emails,default
      --sleep=3
      --tries=3
      --max-time=3600
      --timeout=120

networks:
  albatecrest-backend:
    driver: bridge
    name: albatecrest-backend

volumes:
  albatecrest_mysql_data:
    name: albatecrest_mysql_data
  albatecrest_redis_data:
    name: albatecrest_redis_data
