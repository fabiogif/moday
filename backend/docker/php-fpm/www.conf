; Pool PHP-FPM de produção — substitui o default de fábrica (pm.max_children=5),
; que era o teto real de concorrência da API (ver docs/specs/performance-k6.md e
; medição local em k6/reports/load-BASELINE-pm5-8vus.json: p95 subia pra ~7.5s
; com só 8 usuários simultâneos, mesmo com CPU/RAM sobrando).
;
; max_children=15 é conservador de propósito: a VM Oracle Cloud tem só 4 vCPU
; (nproc), compartilhados com GitLab, Mailcow (ClamAV/Rspamd são pesados de
; CPU) e o stack "moday" (outra instância do mesmo app, em uso, rodando em
; paralelo — ver docker ps em produção). RAM não é o limitante (14GB
; "available" mesmo com tudo isso rodando; nosso container usa ~47MB parado),
; então o teto real aqui é CPU compartilhada, não memória.
;
; Testado localmente (14 vCPU dedicados) com max_children=30: 16-19x menos
; latência, 2.7x mais throughput vs o default de 5 (k6/reports/load-TUNED-pm30-8vus.json).
; Em produção, com 1/3 dos cores e compartilhados, 15 ainda é 3x o teto atual
; sem arriscar competir demais pelos 4 cores com os outros serviços da VM.

[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 15
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
